<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 72" width="100%" height="100%">
  <defs>
    <linearGradient id="aiCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0f7f3" />
    </linearGradient>
    <filter id="aiShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#143d30" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- Base Card -->
  <rect x="4" y="4" width="202" height="64" rx="18" fill="url(#aiCardBg)" stroke="#d8f3dc" stroke-width="1.5" filter="url(#aiShadow)" />

  <!-- AI Brain / Chip Icon -->
  <rect x="16" y="16" width="40" height="40" rx="12" fill="#d8f3dc" />
  
  <!-- Stylized Brain / Node vector -->
  <g stroke="#2d6a4f" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M 31 31 C 28 31 26 33 26 36 C 26 38 27 39 28 40 C 27 41 26 43 28 45 C 29 46 31 46 32 45 L 32 47" />
    <path d="M 41 31 C 44 31 46 33 46 36 C 46 38 45 39 44 40 C 45 41 46 43 44 45 C 43 46 41 46 40 45 L 40 47" />
    <line x1="36" y1="28" x2="36" y2="48" stroke="#40916c" stroke-width="2" />
    <circle cx="36" cy="36" r="2" fill="#2d6a4f" />
  </g>

  <!-- Text -->
  <text x="66" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1b4332">AI Insights</text>
  <text x="66" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="500" fill="#40916c">Smart analysis. Better decisions.</text>
</svg>
