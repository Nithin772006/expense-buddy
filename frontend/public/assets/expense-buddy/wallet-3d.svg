<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="walletBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#74c69d" />
      <stop offset="50%" stop-color="#40916c" />
      <stop offset="100%" stop-color="#2d6a4f" />
    </linearGradient>
    <linearGradient id="walletBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e8f5e9" />
    </linearGradient>
    <linearGradient id="claspGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7d7c5" />
      <stop offset="100%" stop-color="#52b788" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#1b4332" flood-opacity="0.25" />
    </filter>
    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ffffff" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base 3D Rounded Container -->
  <rect x="10" y="10" width="100" height="100" rx="28" fill="url(#walletBg)" filter="url(#softShadow)" />

  <!-- Glass Inner Highlight -->
  <rect x="12" y="12" width="96" height="48" rx="26" fill="url(#walletBody)" opacity="0.18" />

  <!-- Back Flap -->
  <path d="M 28 42 C 28 36 34 32 40 32 L 80 32 C 86 32 92 36 92 42 L 92 48 L 28 48 Z" fill="#b7e4c7" opacity="0.6" />

  <!-- Wallet Body -->
  <rect x="26" y="44" width="68" height="46" rx="12" fill="url(#walletBody)" filter="url(#innerGlow)" />

  <!-- Wallet Stitch Line Detail -->
  <rect x="30" y="48" width="60" height="38" rx="8" fill="none" stroke="#95d5b2" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7" />

  <!-- Wallet Clasp Flap -->
  <path d="M 68 54 L 88 54 C 93 54 96 57 96 62 C 96 67 93 70 88 70 L 68 70 Z" fill="url(#claspGrad)" filter="url(#softShadow)" />
  
  <!-- Metallic Clasp Stud -->
  <circle cx="86" cy="62" r="3.5" fill="#ffffff" />
  <circle cx="86" cy="62" r="2" fill="#2d6a4f" opacity="0.6" />
</svg>
