<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="walletBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#74c69d" />
      <stop offset="50%" stop-color="#40916c" />
      <stop offset="100%" stop-color="#2d6a4f" />
    </linearGradient>
    <linearGradient id="walletBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e8f5e9" />
    </linearGradient>
    <linearGradient id="claspGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7d7c5" />
      <stop offset="100%" stop-color="#52b788" />
    </linearGradient>
    <filter id="walletBlur" x="0" y="0" width="120" height="120" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2.2" />
    </filter>
  </defs>

  <!-- 3D Dimensional Base Shadow (follows rounded container rx="28" with zero edge clipping) -->
  <rect x="13" y="14" width="94" height="92" rx="26" fill="#143d30" opacity="0.12" filter="url(#walletBlur)" />
  <rect x="11.5" y="12" width="97" height="95" rx="27" fill="#143d30" opacity="0.05" />

  <!-- Base 3D Rounded Container -->
  <rect x="10" y="10" width="100" height="100" rx="28" fill="url(#walletBg)" />

  <!-- Glass Inner Highlight -->
  <rect x="12" y="12" width="96" height="48" rx="26" fill="url(#walletBody)" opacity="0.18" />

  <!-- Back Flap -->
  <path d="M 28 42 C 28 36 34 32 40 32 L 80 32 C 86 32 92 36 92 42 L 92 48 L 28 48 Z" fill="#b7e4c7" opacity="0.6" />

  <!-- Wallet Body Shadow & Body -->
  <rect x="26" y="45" width="68" height="46" rx="12" fill="#1b4332" opacity="0.12" />
  <rect x="26" y="44" width="68" height="46" rx="12" fill="url(#walletBody)" />

  <!-- Wallet Stitch Line Detail -->
  <rect x="30" y="48" width="60" height="38" rx="8" fill="none" stroke="#95d5b2" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7" />

  <!-- Wallet Clasp Shadow & Flap -->
  <path d="M 68 55.5 L 88 55.5 C 93 55.5 96 58.5 96 63.5 C 96 68.5 93 71.5 88 71.5 L 68 71.5 Z" fill="#1b4332" opacity="0.15" />
  <path d="M 68 54 L 88 54 C 93 54 96 57 96 62 C 96 67 93 70 88 70 L 68 70 Z" fill="url(#claspGrad)" />
  
  <!-- Metallic Clasp Stud -->
  <circle cx="86" cy="62" r="3.5" fill="#ffffff" />
  <circle cx="86" cy="62" r="2" fill="#2d6a4f" opacity="0.6" />
</svg>
