<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 110" width="100%" height="100%">
  <defs>
    <linearGradient id="chartBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f2f9f4" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#52b788" />
      <stop offset="100%" stop-color="#2d6a4f" />
    </linearGradient>
    <filter id="chartShadow" x="-10%" y="-15%" width="120%" height="135%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#143d30" flood-opacity="0.16" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="5" y="5" width="170" height="100" rx="20" fill="url(#chartBg)" stroke="#d8f3dc" stroke-width="1.5" filter="url(#chartShadow)" />

  <!-- Title & Icon -->
  <text x="18" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#2d6a4f">Spending Trend</text>
  
  <!-- Mini Trend Graph Line -->
  <path d="M 18 52 L 28 44 L 38 48 L 48 38" fill="none" stroke="#27c97a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <polyline points="43,38 48,38 48,43" fill="none" stroke="#27c97a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- +12% Pill -->
  <text x="54" y="47" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#1b4332">+12%</text>
  <text x="18" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#74c69d">vs last month</text>

  <!-- Vertical Bar Chart -->
  <g transform="translate(108, 32)">
    <rect x="0" y="32" width="7" height="18" rx="3.5" fill="#b7e4c7" />
    <rect x="11" y="24" width="7" height="26" rx="3.5" fill="#74c69d" />
    <rect x="22" y="16" width="7" height="34" rx="3.5" fill="#52b788" />
    <rect x="33" y="20" width="7" height="30" rx="3.5" fill="#40916c" />
    <rect x="44" y="6" width="7" height="44" rx="3.5" fill="url(#barGrad)" />
  </g>
</svg>
