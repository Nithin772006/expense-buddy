<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 76" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0f7f3" />
    </linearGradient>
    <filter id="pillShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#143d30" flood-opacity="0.14" />
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#143d30" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Base Card -->
  <rect x="4" y="4" width="232" height="68" rx="20" fill="url(#cardBg)" stroke="#d8f3dc" stroke-width="1.5" filter="url(#pillShadow)" />

  <!-- Spotify Green Icon -->
  <circle cx="36" cy="38" r="18" fill="#1ed760" />
  <!-- Spotify Waves -->
  <path d="M 28 32 C 34 29 42 30 46 33" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 29 37 C 34 35 41 36 44 38" fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" />
  <path d="M 30 42 C 34 40 39 41 42 43" fill="none" stroke="#000000" stroke-width="1.8" stroke-linecap="round" />

  <!-- Text -->
  <text x="64" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1b4332">Spotify Premium</text>
  <text x="64" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#0b2e21">₹119</text>
  <text x="110" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#52b788">Subscription</text>

  <!-- Green Verification Pill/Check -->
  <circle cx="212" cy="38" r="11" fill="#40916c" />
  <path d="M 207 38 L 210.5 41.5 L 217 34.5" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
</svg>
