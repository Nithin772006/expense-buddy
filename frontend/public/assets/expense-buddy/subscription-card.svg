<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 72" width="100%" height="100%">
  <defs>
    <linearGradient id="subCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0f7f3" />
    </linearGradient>
    <filter id="subShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#143d30" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- Base Card -->
  <rect x="4" y="4" width="212" height="64" rx="18" fill="url(#subCardBg)" stroke="#d8f3dc" stroke-width="1.5" filter="url(#subShadow)" />

  <!-- Repeat/Recurring Icon Circle -->
  <circle cx="36" cy="36" r="18" fill="#d8f3dc" />
  <path d="M 29 33 C 30 29 34 27 38 27 C 42 27 45 29 46 32 M 46 29 L 46 33 L 42 33" fill="none" stroke="#2d6a4f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 43 39 C 42 43 38 45 34 45 C 30 45 27 43 26 40 M 26 43 L 26 39 L 30 39" fill="none" stroke="#2d6a4f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Text -->
  <text x="64" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1b4332">Subscriptions</text>
  <text x="64" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="500" fill="#52b788">2 active • 1 review needed</text>

  <!-- Chevron -->
  <path d="M 200 33 L 204 36 L 200 39" fill="none" stroke="#74c69d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
</svg>
