<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="coinFace" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#b7e4c7" />
      <stop offset="45%" stop-color="#74c69d" />
      <stop offset="85%" stop-color="#40916c" />
      <stop offset="100%" stop-color="#2d6a4f" />
    </radialGradient>
    <linearGradient id="coinRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8f3dc" />
      <stop offset="50%" stop-color="#52b788" />
      <stop offset="100%" stop-color="#1b4332" />
    </linearGradient>
    <filter id="coinShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1b4332" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Rim / 3D Edge -->
  <circle cx="50" cy="50" r="44" fill="url(#coinRim)" filter="url(#coinShadow)" />
  
  <!-- Face -->
  <circle cx="50" cy="50" r="39" fill="url(#coinFace)" />
  
  <!-- Inner Ring detail -->
  <circle cx="50" cy="50" r="34" fill="none" stroke="#d8f3dc" stroke-width="1.5" opacity="0.6" stroke-dasharray="4 2" />

  <!-- Rupee Symbol ₹ -->
  <g fill="#ffffff" filter="drop-shadow(0px 2px 2px rgba(27, 67, 50, 0.4))">
    <!-- Top Bar -->
    <rect x="36" y="32" width="28" height="4.5" rx="2" />
    <!-- Second Bar -->
    <rect x="36" y="40.5" width="22" height="4" rx="2" />
    <!-- Curved Spine and Loop -->
    <path d="M 44 34 L 44 49 C 48 49 57 48 57 42 C 57 36 50 35 44 35" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
    <!-- Diagonal Leg -->
    <path d="M 47 48 L 62 67" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
  </g>

  <!-- Top highlight arc -->
  <path d="M 22 34 A 36 36 0 0 1 78 34" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.4" />
</svg>
