<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="coinFace" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#b7e4c7" />
      <stop offset="45%" stop-color="#74c69d" />
      <stop offset="85%" stop-color="#40916c" />
      <stop offset="100%" stop-color="#2d6a4f" />
    </radialGradient>
    <linearGradient id="coinRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8f3dc" />
      <stop offset="50%" stop-color="#52b788" />
      <stop offset="100%" stop-color="#1b4332" />
    </linearGradient>
    <filter id="coinShadow" x="0" y="0" width="100" height="100" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2.2" />
    </filter>
  </defs>

  <!-- 3D Dimensional Base Shadow (follows circular coin geometry with zero edge clipping) -->
  <ellipse cx="50" cy="53" rx="40" ry="38" fill="#1b4332" opacity="0.14" filter="url(#coinShadow)" />
  <ellipse cx="50" cy="51" rx="41" ry="40" fill="#1b4332" opacity="0.06" />

  <!-- Rim / 3D Edge -->
  <circle cx="50" cy="49" r="42" fill="url(#coinRim)" />
  
  <!-- Face -->
  <circle cx="50" cy="49" r="37.5" fill="url(#coinFace)" />
  
  <!-- Inner Ring detail -->
  <circle cx="50" cy="49" r="33" fill="none" stroke="#d8f3dc" stroke-width="1.5" opacity="0.6" stroke-dasharray="4 2" />

  <!-- Rupee Symbol ₹ -->
  <g fill="#ffffff">
    <!-- Top Bar -->
    <rect x="36" y="31" width="28" height="4.5" rx="2" />
    <!-- Second Bar -->
    <rect x="36" y="39.5" width="22" height="4" rx="2" />
    <!-- Curved Spine and Loop -->
    <path d="M 44 33 L 44 48 C 48 48 57 47 57 41 C 57 35 50 34 44 34" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
    <!-- Diagonal Leg -->
    <path d="M 47 47 L 62 66" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
  </g>

  <!-- Top highlight arc -->
  <path d="M 23 33 A 34 34 0 0 1 77 33" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.4" />
</svg>
