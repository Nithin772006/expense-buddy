<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <filter id="donutShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#143d30" flood-opacity="0.2" />
    </filter>
  </defs>
  
  <g filter="url(#donutShadow)" transform="rotate(-90 60 60)">
    <!-- Circumference of r=36 is 2 * PI * 36 ≈ 226.2 -->
    <!-- Slice 1: Emerald/Forest 28% (stroke-dasharray: 63.3 162.9) -->
    <circle cx="60" cy="60" r="36" fill="transparent" stroke="#2d6a4f" stroke-width="16"
      stroke-dasharray="63.3 162.9" stroke-dashoffset="0" />
      
    <!-- Slice 2: Mint 27% (stroke-dasharray: 61 165.2) -->
    <circle cx="60" cy="60" r="36" fill="transparent" stroke="#52b788" stroke-width="16"
      stroke-dasharray="61 165.2" stroke-dashoffset="-63.3" />
      
    <!-- Slice 3: Warm Peach/Tan 18% (stroke-dasharray: 40.7 185.5) -->
    <circle cx="60" cy="60" r="36" fill="transparent" stroke="#e09f67" stroke-width="16"
      stroke-dasharray="40.7 185.5" stroke-dashoffset="-124.3" />
      
    <!-- Slice 4: Soft Purple/Blue 15% (stroke-dasharray: 33.9 192.3) -->
    <circle cx="60" cy="60" r="36" fill="transparent" stroke="#5b8bf7" stroke-width="16"
      stroke-dasharray="33.9 192.3" stroke-dashoffset="-165" />
      
    <!-- Slice 5: Pastel Mint 12% (stroke-dasharray: 27.3 198.9) -->
    <circle cx="60" cy="60" r="36" fill="transparent" stroke="#b7e4c7" stroke-width="16"
      stroke-dasharray="27.3 198.9" stroke-dashoffset="-198.9" />
  </g>

  <!-- Center Core -->
  <circle cx="60" cy="60" r="24" fill="#ffffff" />
  <circle cx="60" cy="60" r="20" fill="#f4f9f5" />
  <text x="60" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#1b4332" text-anchor="middle">₹24k</text>
</svg>
