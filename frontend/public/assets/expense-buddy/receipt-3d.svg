<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 140" width="100%" height="100%">
  <defs>
    <linearGradient id="receiptBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f2f7f4" />
    </linearGradient>
    <filter id="receiptShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#1b4332" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Main Scalloped Receipt -->
  <path d="
    M 18 16 
    C 18 10 22 8 28 8 
    L 82 8 
    C 88 8 92 10 92 16 
    L 92 118 
    L 86 114 L 80 118 L 74 114 L 68 118 L 62 114 L 56 118 L 50 114 L 44 118 L 38 114 L 32 118 L 26 114 L 18 118 
    Z" 
    fill="url(#receiptBody)" 
    stroke="#d8f3dc" 
    stroke-width="1.5"
    filter="url(#receiptShadow)" 
  />

  <!-- Top Brand Notch / Header -->
  <rect x="28" y="20" width="54" height="6" rx="3" fill="#52b788" />
  
  <!-- Line items -->
  <rect x="28" y="34" width="38" height="4" rx="2" fill="#b7e4c7" />
  <rect x="72" y="34" width="10" height="4" rx="2" fill="#74c69d" />

  <rect x="28" y="44" width="32" height="4" rx="2" fill="#b7e4c7" />
  <rect x="72" y="44" width="10" height="4" rx="2" fill="#74c69d" />

  <rect x="28" y="54" width="36" height="4" rx="2" fill="#b7e4c7" />
  <rect x="72" y="54" width="10" height="4" rx="2" fill="#74c69d" />

  <!-- Dotted Divider -->
  <line x1="28" y1="68" x2="82" y2="68" stroke="#95d5b2" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- Total Section -->
  <rect x="28" y="78" width="22" height="5" rx="2.5" fill="#2d6a4f" />
  <rect x="62" y="77" width="20" height="7" rx="3" fill="#40916c" />

  <!-- Mini Barcode at bottom -->
  <g fill="#74c69d" opacity="0.8">
    <rect x="32" y="94" width="2.5" height="12" />
    <rect x="36.5" y="94" width="1.5" height="12" />
    <rect x="40" y="94" width="3.5" height="12" />
    <rect x="45.5" y="94" width="1" height="12" />
    <rect x="48.5" y="94" width="3" height="12" />
    <rect x="53.5" y="94" width="2" height="12" />
    <rect x="57.5" y="94" width="3.5" height="12" />
    <rect x="63" y="94" width="1.5" height="12" />
    <rect x="66.5" y="94" width="3" height="12" />
    <rect x="71.5" y="94" width="2" height="12" />
    <rect x="75.5" y="94" width="1.5" height="12" />
  </g>
</svg>
