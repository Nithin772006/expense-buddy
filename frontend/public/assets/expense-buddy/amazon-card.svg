<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 76" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBgAmz" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0f7f3" />
    </linearGradient>
    <filter id="pillShadowAmz" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#143d30" flood-opacity="0.14" />
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#143d30" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Base Card -->
  <rect x="4" y="4" width="232" height="68" rx="20" fill="url(#cardBgAmz)" stroke="#d8f3dc" stroke-width="1.5" filter="url(#pillShadowAmz)" />

  <!-- Amazon Icon Circle -->
  <rect x="18" y="20" width="36" height="36" rx="12" fill="#232f3e" />
  <text x="23" y="41" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#ffffff" letter-spacing="-0.5">amazon</text>
  <path d="M 23 45 C 30 49 42 49 47 44" fill="none" stroke="#ff9900" stroke-width="1.8" stroke-linecap="round" />

  <!-- Text -->
  <text x="64" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1b4332">Amazon</text>
  <text x="64" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#0b2e21">₹2,450</text>
  <text x="124" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#52b788">Shopping</text>

  <!-- Green Verification Pill/Check -->
  <circle cx="212" cy="38" r="11" fill="#40916c" />
  <path d="M 207 38 L 210.5 41.5 L 217 34.5" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
</svg>
