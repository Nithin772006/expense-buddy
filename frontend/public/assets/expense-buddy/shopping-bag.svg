<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bagFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#95d5b2" />
      <stop offset="60%" stop-color="#52b788" />
      <stop offset="100%" stop-color="#2d6a4f" />
    </linearGradient>
    <linearGradient id="bagFold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1b4332" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#1b4332" stop-opacity="0.0" />
    </linearGradient>
    <filter id="bagShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#1b4332" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Handles -->
  <path d="M 45 42 C 45 22 53 16 60 16 C 67 16 75 22 75 42" fill="none" stroke="#d8f3dc" stroke-width="4.5" stroke-linecap="round" />
  <path d="M 45 42 C 45 25 53 19 60 19 C 67 19 75 25 75 42" fill="none" stroke="#40916c" stroke-width="2" stroke-linecap="round" opacity="0.6" />

  <!-- Bag Main Body -->
  <path d="M 30 42 L 90 42 L 96 102 C 96 106 92 110 87 110 L 33 110 C 28 110 24 106 24 102 Z" fill="url(#bagFront)" filter="url(#bagShadow)" />

  <!-- Top Rim Crease -->
  <path d="M 30 42 L 90 42 L 89 48 L 31 48 Z" fill="#d8f3dc" opacity="0.4" />

  <!-- Side Fold Shadows -->
  <path d="M 30 42 L 40 42 L 34 110 L 24 110 Z" fill="url(#bagFold)" />
  <path d="M 80 42 L 90 42 L 96 110 L 86 110 Z" fill="url(#bagFold)" />

  <!-- Center Buddy Plant/Leaf Emblem -->
  <circle cx="60" cy="74" r="16" fill="#ffffff" opacity="0.25" />
  <path d="M 60 62 C 60 62 50 72 50 80 C 50 85 54 88 60 88 C 66 88 70 85 70 80 C 70 72 60 62 60 62 Z" fill="#ffffff" />
  <path d="M 60 68 L 60 86" stroke="#52b788" stroke-width="2" stroke-linecap="round" />
</svg>
